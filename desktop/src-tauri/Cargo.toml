[package]
name = "orbit-desktop"
version = "0.1.0"
edition = "2021"
authors = ["Eloir Corona"]
license = "MIT"
description = "orbit desktop — terminal emulator + management UI"

[lib]
name = "orbit_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-window-state = "2"

portable-pty = "0.8"

orbit-core   = { path = "../../crates/orbit-core" }
orbit-engine = { path = "../../crates/orbit-engine" }
orbit-client = { path = "../../crates/orbit-client" }

directories = { workspace = true }

base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { version = "1", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
