<!-- ---
name: default
description: General-purpose document template
variables: []
--- -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    @page {
      size: A4;
      margin: 25mm 20mm 28mm 20mm;
      @bottom-left {
        content: element(running-footer);
        vertical-align: top;
      }
      @bottom-right {
        content: "Page " counter(page) " / " counter(pages);
        font-size: 7.5pt;
        color: #9ca3af;
        font-family: -apple-system, "Segoe UI", Arial, sans-serif;
        border-top: 0.5px solid #e5e7eb;
        padding-top: 5pt;
        vertical-align: top;
      }
    }

    #running-footer {
      position: running(running-footer);
      font-size: 7.5pt;
      color: #6b7280;
      line-height: 1.5;
      font-family: -apple-system, "Segoe UI", Arial, sans-serif;
      border-top: 0.5px solid #e5e7eb;
      padding-top: 5pt;
    }

    body {
      font-family: -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      font-size: 11pt;
      line-height: 1.6;
      color: #1a1a1a;
      background: #fff;
    }
    header {
      border-bottom: 2px solid #2563eb;
      padding-bottom: 16px;
      margin-bottom: 32px;
    }
    header h1 {
      font-size: 24pt;
      font-weight: 700;
      color: #111;
      margin-bottom: 6px;
    }
    .meta {
      font-size: 9pt;
      color: #666;
    }
    .meta span { margin-right: 20px; }
    main { margin-bottom: 48px; }
    main h1 { font-size: 18pt; font-weight: 700; margin: 28px 0 12px; color: #111; }
    main h2 { font-size: 14pt; font-weight: 600; margin: 24px 0 10px; color: #222; }
    main h3 { font-size: 12pt; font-weight: 600; margin: 20px 0 8px; color: #333; }
    main p { margin: 0 0 12px; }
    main ul, main ol { margin: 0 0 12px 20px; }
    main li { margin: 4px 0; }
    main code {
      background: #f4f4f5;
      border: 1px solid #e4e4e7;
      border-radius: 3px;
      padding: 1px 5px;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: 9pt;
    }
    main pre {
      background: #f8f8f9;
      border: 1px solid #e4e4e7;
      border-radius: 6px;
      padding: 14px 16px;
      margin: 0 0 16px;
    }
    main pre code { background: none; border: none; padding: 0; font-size: 9pt; }
    main blockquote {
      border-left: 4px solid #2563eb;
      padding: 8px 16px;
      margin: 0 0 12px;
      color: #555;
      background: #f0f5ff;
      border-radius: 0 4px 4px 0;
    }
    main table {
      width: 100%;
      border-collapse: collapse;
      margin: 0 0 16px;
      font-size: 10pt;
    }
    main th {
      background: #2563eb;
      color: #fff;
      padding: 8px 12px;
      text-align: left;
      font-weight: 600;
    }
    main td { padding: 7px 12px; border-bottom: 1px solid #e4e4e7; }
    main tr:nth-child(even) td { background: #f8faff; }
    main a { color: #2563eb; text-decoration: none; }
    main hr { border: none; border-top: 1px solid #e4e4e7; margin: 24px 0; }

    .mermaid-diagram {
      margin: 16px 0;
      text-align: center;
      page-break-inside: avoid;
    }
    .mermaid-diagram svg {
      max-width: 100%;
      height: auto;
    }

    @media print {
      body { background: white; }
    }
  </style>
</head>
<body>
  <div id="running-footer">
    Generated at {{ timestamp_human }} by {{ display_name }} with orbit documents
  </div>
  <header>
    <h1>{{ title }}</h1>
    <div class="meta">
      <span>{{ date }}</span>
      {% if author %}<span>{{ author }}</span>{% endif %}
      {% if orbit_scope %}<span>{{ orbit_scope }}</span>{% endif %}
    </div>
  </header>
  <main>
    {{ content_html }}
  </main>
</body>
</html>
