<!-- ---
name: blank
description: Minimal blank SVG canvas with title and optional description
variables: []
--- -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    </style>
  </defs>
  <rect width="800" height="480" fill="#ffffff" rx="8"/>
  <text x="400" y="200" text-anchor="middle" font-size="28" font-weight="600" fill="#1a1a2e">{{ title }}</text>
  {% if description %}
  <text x="400" y="240" text-anchor="middle" font-size="16" fill="#6b7280">{{ description }}</text>
  {% endif %}
</svg>
